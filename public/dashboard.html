<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swa-aim Portal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>Swa-aim Dashboard</h1>
        <button onclick="logout()">Logout</button>
    </nav>
    <div id="content">
        </div>
    <script>
        // REDIRECT GUARD: If no userId is found, send back to login
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = "/"; 
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>
</body>
</html>
