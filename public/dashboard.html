<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim | Professional Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">🛡️ Swa-aim</div>
            <nav>
                <a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h1>Client Protection Overview</h1>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-file-shield"></i>
                    <div><h3>Total Policies</h3><p id="pCount">0</p></div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-indian-rupee-sign"></i>
                    <div><h3>Monthly Premium</h3><p id="pPremium">₹0</p></div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-umbrella"></i>
                    <div><h3>Sum Assured</h3><p id="pSum">₹0</p></div>
                </div>
            </div>

            <section class="policy-form">
                <h3><i class="fas fa-plus"></i> Add New Policy</h3>
                <div class="form-row">
                    <input type="text" id="planName" placeholder="Plan Name">
                    <input type="number" id="premium" placeholder="Premium (₹)">
                    <select id="freq">
                        <option value="Yearly">Yearly</option>
                        <option value="Monthly">Monthly</option>
                    </select>
                    <button class="btn-primary">Secure Data</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = "/";

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>
</body>
</html>
