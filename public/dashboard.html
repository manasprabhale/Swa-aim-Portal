<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim | Enterprise Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --glass: #ffffff;
            --text-main: #1e293b;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; display: flex; min-height: 100vh; color: var(--text-main); }

        /* Sidebar */
        nav { width: 240px; background: #0f172a; color: white; padding: 30px 20px; display: flex; flex-direction: column; }
        nav h2 { color: #38bdf8; margin-bottom: 50px; }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }

        /* Stats Row */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-bottom: 4px solid var(--primary); }
        .stat-card small { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        .stat-card h2 { margin: 10px 0 0 0; font-size: 1.5rem; color: var(--primary); }

        /* Search & Actions */
        .search-bar { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 25px; outline: none; font-size: 1rem; }

        /* New Policy Form Card */
        .form-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* Policy List Styling */
        .policy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .policy-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: 0.3s; position: relative; }
        .policy-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .policy-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .edit { background: #fef3c7; color: #92400e; }
        .delete { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<nav>
    <h2>🛡️ Swa-aim</h2>
    <p style="font-size: 0.8rem; opacity: 0.6;">Welcome Back!</p>
    <div style="margin-top: auto;">
        <button onclick="logout()" style="width: 100%; padding: 10px; background: #334155; border: none; color: white; border-radius: 8px; cursor: pointer;">Sign Out</button>
    </div>
</nav>

<main>
    <div class="stats-row">
        <div class="stat-card">
            <small>Total Sum Assured</small>
            <h2 id="statSum">₹0</h2>
        </div>
        <div class="stat-card">
            <small>Total Annual Premium</small>
            <h2 id="statPremium">₹0</h2>
        </div>
        <div class="stat-card">
            <small>Active Policies</small>
            <h2 id="statCount">0</h2>
        </div>
    </div>

    <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Search plan name or policy number..." oninput="debounceSearch()">

    <div class="form-card">
        <h3 style="margin-top: 0;">Add New Insurance Policy</h3>
        <form id="policyForm" class="form-grid">
            <input type="text" id="planName" placeholder="Plan Name" required>
            <input type="text" id="policyNumber" placeholder="Policy Number" required>
            <select id="paymentMode">
                <option value="Yearly">Yearly</option>
                <option value="Monthly">Monthly</option>
            </select>
            <input type="number" id="premiumAmount" placeholder="Premium (₹)" required>
            <input type="number" id="sumAssured" placeholder="Sum Assured (₹)" required>
            <button type="submit" class="btn-submit">Add Policy</button>
        </form>
    </div>

    <div id="policyList" class="policy-grid"></div>
</main>

<script>
    const API = "https://swaim-portal.onrender.com/api/auth";
    const userId = localStorage.getItem('userId');
// If no user is found, send them to the login page
if (!userId) {
    window.location.href = "login.html"; 
}
    let searchTimer;

    if (!userId) window.location.href = "login.html";

    // CORE LOGIC: Fetch and Calculate Stats
    async function loadPolicies(query = "") {
        const res = await fetch(`${API}/policies/${userId}?search=${query}`);
        const data = await res.json();
        
        const container = document.getElementById('policyList');
        container.innerHTML = "";

        // Variables for Stats
        let totalSum = 0;
        let totalPremium = 0;

        data.forEach(p => {
            totalSum += p.sumAssured;
            totalPremium += p.premiumAmount;

            container.innerHTML += `
                <div class="policy-card">
                    <h3>${p.planName}</h3>
                    <p style="color: #64748b; font-size: 0.85rem;">No: ${p.policyNumber}</p>
                    <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                        <span><small>Premium</small><br><strong>₹${p.premiumAmount.toLocaleString()}</strong></span>
                        <span><small>Coverage</small><br><strong>₹${p.sumAssured.toLocaleString()}</strong></span>
                    </div>
                    <div class="btn-group">
                        <button class="btn-action edit" onclick="editPolicy('${p._id}', '${p.planName}')">Edit</button>
                        <button class="btn-action delete" onclick="deletePolicy('${p._id}')">Delete</button>
                    </div>
                </div>
            `;
        });

        // Update Stats UI
        document.getElementById('statSum').innerText = `₹${totalSum.toLocaleString()}`;
        document.getElementById('statPremium').innerText = `₹${totalPremium.toLocaleString()}`;
        document.getElementById('statCount').innerText = data.length;
    }

    // SEARCH DEBOUNCE
    function debounceSearch() {
        clearTimeout(searchTimer);
        const q = document.getElementById('searchInput').value;
        searchTimer = setTimeout(() => loadPolicies(q), 400);
    }

    // CREATE
    document.getElementById('policyForm').onsubmit = async (e) => {
        e.preventDefault();
        const body = {
            userId,
            planName: document.getElementById('planName').value,
            policyNumber: document.getElementById('policyNumber').value,
            paymentMode: document.getElementById('paymentMode').value,
            premiumAmount: Number(document.getElementById('premiumAmount').value),
            sumAssured: Number(document.getElementById('sumAssured').value)
        };
        const res = await fetch(`${API}/add-policy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (res.ok) { e.target.reset(); loadPolicies(); }
        else { alert("Policy Number already exists!"); }
    };

    // DELETE
    async function deletePolicy(id) {
        if (confirm("Permanently delete this record?")) {
            await fetch(`${API}/policy/${id}`, { method: 'DELETE' });
            loadPolicies();
        }
    }

    // EDIT (Simple Title Update)
    async function editPolicy(id, oldName) {
        const newName = prompt("Update Plan Name:", oldName);
        if (newName) {
            await fetch(`${API}/policy/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ planName: newName })
            });
            loadPolicies();
        }
    }

    function logout() { localStorage.clear(); window.location.href="login.html"; }
    loadPolicies();
</script>

</body>
</html>
