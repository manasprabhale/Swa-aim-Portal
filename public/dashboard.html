<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swa-aim Portal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Swa-aim Portal</h1>
        <button onclick="logout()">Logout</button>
    </header>

    <main>
        <section id="policyForm">
            <h3>Add New Policy</h3>
            <input type="text" id="planName" placeholder="Plan Name">
            <input type="number" id="premium" placeholder="Premium (₹)">
            <button onclick="savePolicy()">Save Policy Securely</button>
        </section>
    </main>

    <script>
        // REDIRECT GUARD: Check if user is logged in
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = "/"; 
        }

        async function savePolicy() {
            // Logic to send data to /api/auth/add-policy
            alert("Policy saved!");
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>
</body>
</html>
