<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim - Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="logo">🛡️ Swa-aim Portal</div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </header>

        <div class="stats-row">
            <div class="stat-card"><h3>Policies</h3><p id="policyCount">0</p></div>
            <div class="stat-card"><h3>Total Premium</h3><p id="totalPremium">₹0</p></div>
            <div class="stat-card"><h3>Sum Assured</h3><p id="totalSum">₹0</p></div>
        </div>

        <main>
            <section class="policy-form-card">
                <h3>Add New Protected Policy</h3>
                <div class="form-grid">
                    <input type="text" id="planName" placeholder="Plan Name">
                    <input type="text" id="policyNumber" placeholder="Policy Number">
                    <select id="frequency">
                        <option value="Yearly">Yearly</option>
                        <option value="Monthly">Monthly</option>
                    </select>
                    <input type="number" id="premiumAmount" placeholder="Premium (₹)">
                    <input type="number" id="sumAssured" placeholder="Sum Assured (₹)">
                </div>
                <button class="btn-primary" onclick="savePolicy()">Save Policy Securely</button>
            </section>

            <section class="policy-list">
                <h3>Your Active Policies</h3>
                <table>
                    <thead>
                        <tr><th>Plan Name</th><th>Premium</th><th>Frequency</th><th>Status</th></tr>
                    </thead>
                    <tbody id="policyTableBody"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // REDIRECT GUARD: Prevents loop and unauthorized access
        const userId = localStorage.getItem('userId');
        if (!userId) { window.location.href = "/"; }

        function logout() {
            localStorage.clear();
            window.location.href = "/"; // Fixed redirect path
        }

        // Logic for savePolicy() and fetchPolicies() goes here
    </script>
</body>
</html>
