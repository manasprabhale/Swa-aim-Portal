<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swa-aim | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f4f7f9; display: block; padding: 20px;">
    <div style="max-width: 900px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>🛡️ Policy Management</h1>
            <button onclick="logout()" style="width: auto; background: #ef4444; padding: 8px 15px;">Logout</button>
        </div>

        <div class="login-card" style="max-width: 100%; text-align: left; margin-bottom: 30px;">
            <h3>Add New Policy</h3>
            <form id="policyForm" style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="pName" placeholder="Policy Name (e.g. Life Insurance)" required>
                <input type="text" id="pHolder" placeholder="Holder Name" required>
                <button type="submit" style="width: auto; background: #10b981; padding: 0 20px;">Save</button>
            </form>
        </div>

        <div id="policyList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            </div>
    </div>

    <script>
        if (!localStorage.getItem('userEmail')) window.location.href = "/";

        async function loadPolicies() {
            const res = await fetch('/api/policies');
            const policies = await res.json();
            const list = document.getElementById('policyList');
            list.innerHTML = '';
            
            policies.forEach(p => {
                list.innerHTML += `
                    <div class="login-card" style="margin: 0; text-align: left; border-left: 5px solid #2563eb; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h3 style="margin:0">${p.name}</h3>
                            <p style="color: #666">${p.holder}</p>
                        </div>
                        <button onclick="deletePolicy('${p._id}')" style="width: auto; background: none; color: #ef4444; border: 1px solid #ef4444; padding: 5px 10px;">Delete</button>
                    </div>
                `;
            });
        }

        document.getElementById('policyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/policies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('pName').value,
                    holder: document.getElementById('pHolder').value
                })
            });
            document.getElementById('policyForm').reset();
            loadPolicies();
        });

        async function deletePolicy(id) {
            if (confirm("Delete this policy?")) {
                await fetch(`/api/policies/${id}`, { method: 'DELETE' });
                loadPolicies();
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }

        loadPolicies();
    </script>
</body>
</html>
