<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim Portal | Investment Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-box" class="container">
        <h1>Swa-aim Portal</h1>
        <div class="tab-system">
            <button id="tab-login" class="active" onclick="showTab('login')">Login</button>
            <button id="tab-reg" onclick="showTab('reg')">Register</button>
        </div>

        <form id="login-form">
            <input type="email" id="l-email" placeholder="Email Address" required>
            <input type="password" id="l-pass" placeholder="Password" required>
            <button type="submit">Login</button>
            <p class="toggle-text" onclick="toggleForgot(true)">Forgot Password?</p>
        </form>

        <form id="reg-form" style="display: none;">
            <input type="text" id="r-name" placeholder="Full Name" required>
            <input type="email" id="r-email" placeholder="Email" required>
            <input type="tel" id="r-phone" placeholder="Phone Number" required>
            <input type="password" id="r-pass" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>

        <div id="forgot-box" style="display: none;">
            <h3>Reset Password</h3>
            <p>Please contact support to reset your password.</p>
            <button onclick="toggleForgot(false)">Back to Login</button>
        </div>
    </div>

    <div id="user-dashboard" class="container" style="display: none;">
        <div class="header">
            <h2>Welcome, <span id="user-name">User</span>!</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <h3>Your Policies</h3>
        <div id="policies-container">
            <p>Loading your investments...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
