<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-box" class="container">
        <h1>Swa-aim Portal</h1>
        <div class="tab-system">
            <button id="tab-login" class="active" onclick="showTab('login')">Login</button>
            <button id="tab-reg" onclick="showTab('reg')">Register</button>
        </div>
        <form id="login-form">
            <input type="email" id="l-email" placeholder="Email" required>
            <input type="password" id="l-pass" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <form id="reg-form" style="display: none;">
            <input type="text" id="r-name" placeholder="Name" required>
            <input type="email" id="r-email" placeholder="Email" required>
            <input type="tel" id="r-phone" placeholder="Phone" required>
            <input type="password" id="r-pass" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
    </div>
<div id="forgot-box" style="display: none; text-align: center;">
    <h3>Reset Password</h3>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Enter your email to receive a reset link.</p>
    
    <input type="email" id="forgot-email" placeholder="Enter your registered email" style="width: 100%; margin-bottom: 10px;">
    
    <button id="send-reset-btn" onclick="sendResetLink()" style="background: var(--primary); color: white; width: 100%; padding: 12px; border:none; border-radius:8px; cursor:pointer;">Send Reset Link</button>
    
    <p class="toggle-text" onclick="toggleForgot(false)" style="margin-top: 15px;">Back to Login</p>
</div>
    <div id="user-dashboard" class="container" style="display: none; max-width: 600px;">
        <div class="header">
            <h2>Welcome, <span id="user-name">User</span></h2>
            <button onclick="toggleProfile()" style="background:var(--primary); color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Settings</button>
            <button onclick="logout()" style="background:#ff4444; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Logout</button>
        </div>

        <div id="profile-section" style="display:none; margin-top:20px; padding:15px; background:#f9f9f9; border-radius:10px;">
            <h3>Edit Profile</h3>
            <input type="text" id="edit-name" placeholder="Update Name" style="width:100%; margin-top:10px;">
            <input type="tel" id="edit-phone" placeholder="Update Phone" style="width:100%; margin-top:10px;">
            <button onclick="updateProfile()" style="margin-top:10px; background:green; color:white; border:none; padding:10px; width:100%; border-radius:5px; cursor:pointer;">Save Changes</button>
        </div>

        <div style="margin-top: 20px;">
            <input type="text" id="search-input" placeholder="Search policies..." onkeyup="filterPolicies()" style="width:100%;">
        </div>
        
        <div id="policies-container" style="margin-top: 20px;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
