<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim Portal | Investment Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-box" class="container">
        <h1>Swa-aim Portal</h1>
        
        <div class="tab-system">
            <button id="tab-login" class="active" onclick="showTab('login')">Login</button>
            <button id="tab-reg" onclick="showTab('reg')">Register</button>
        </div>

        <div id="msg-area" style="display:none; text-align:center; margin-bottom:10px; font-size:0.9rem;"></div>

        <form id="login-form">
            <input type="email" id="l-email" placeholder="Email Address" required autocomplete="email">
            <input type="password" id="l-pass" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Login</button>
            <p class="toggle-text" style="cursor:pointer;" onclick="toggleForgot(true)">Forgot Password?</p>
        </form>

        <form id="reg-form" style="display: none;">
            <input type="text" id="r-name" placeholder="Full Name" required autocomplete="name">
            <input type="email" id="r-email" placeholder="Email" required autocomplete="email">
            <input type="tel" id="r-phone" placeholder="Phone Number" required autocomplete="tel">
            <input type="password" id="r-pass" placeholder="Create Password" required autocomplete="new-password">
            <button type="submit">Create Account</button>
        </form>

        <div id="forgot-box" style="display: none; text-align: center;">
            <h3>Reset Password</h3>
            <p style="color: #666; font-size: 0.9rem;">Please contact our support team at <strong>support@swa-aim.com</strong> to reset your password.</p>
            <button type="button" onclick="toggleForgot(false)" style="background: #ccc; color: #333; margin-top: 10px;">Back to Login</button>
        </div>
    </div>

    <div id="user-dashboard" class="container" style="display: none; max-width: 600px;">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            <h2>Hello, <span id="user-name">User</span>!</h2>
            <button class="logout-btn" onclick="logout()" style="background:#ff4444; padding: 5px 15px; color: white; border: none; cursor: pointer;">Logout</button>
        </div>
        
        <div class="content" style="margin-top: 20px;">
            <h3>Your Investment Policies</h3>
            <div id="policies-container">
                <p>Fetching your data from the server...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
