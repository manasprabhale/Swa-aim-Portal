<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swa-aim | Secure Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="login-card">
        <h1>🛡️ Swa-aim</h1>
        <p id="msg">Enter credentials to access the portal</p>
        
        <form id="authForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit" id="btn">Login to Dashboard</button>
        </form>

        <div class="auth-footer">
            <p id="tgl" onclick="toggleMode()" style="cursor:pointer; color: #2563eb; margin-top: 15px; font-size: 14px;">
                Don't have an account? Create one
            </p>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            const tgl = document.getElementById('tgl');

            if (isLogin) {
                btn.innerText = "Login to Dashboard";
                msg.innerText = "Enter credentials to access the portal";
                tgl.innerText = "Don't have an account? Create one";
            } else {
                btn.innerText = "Create Account";
                msg.innerText = "Join the Swa-aim Professional Portal";
                tgl.innerText = "Already have an account? Login";
            }
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulating authentication for this demo
            localStorage.setItem('userEmail', document.getElementById('email').value);
            window.location.href = "/dashboard";
        });
    </script>
</body>
</html>
