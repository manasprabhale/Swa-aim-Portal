<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Swa-aim Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
        .error { color: #ff4444; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="container">
        <h1>New Password</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Please enter a strong new password for your account.
        </p>

        <div id="reset-form-container">
            <form id="reset-password-form">
                <input type="password" id="new-password" placeholder="New Password (min 6 chars)" required minlength="6">
                <input type="password" id="confirm-password" placeholder="Confirm New Password" required minlength="6">
                
                <button type="submit" id="reset-btn">Update Password</button>
            </form>
        </div>

        <div id="message" class="status-msg"></div>
        
        <p class="toggle-text" style="margin-top: 20px;">
            <a href="index.html" style="color: var(--primary); text-decoration: none;">Back to Login</a>
        </p>
    </div>

    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('reset-btn');

            // 1. Basic validation
            if (newPassword !== confirmPassword) {
                messageDiv.className = "status-msg error";
                messageDiv.innerText = "Passwords do not match.";
                return;
            }

            // 2. Get the token from the URL (?token=xxxx)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                messageDiv.className = "status-msg error";
                messageDiv.innerText = "Invalid or missing reset token.";
                return;
            }

            // 3. Send to Backend
            try {
                btn.innerText = "Updating...";
                btn.disabled = true;

                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = "status-msg success";
                    messageDiv.innerText = data.message + " Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    messageDiv.className = "status-msg error";
                    messageDiv.innerText = data.message;
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                }
            } catch (err) {
                messageDiv.className = "status-msg error";
                messageDiv.innerText = "Connection failed. Please try again.";
                btn.disabled = false;
                btn.innerText = "Update Password";
            }
        });
    </script>
</body>
</html>
