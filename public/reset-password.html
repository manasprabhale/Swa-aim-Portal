<!DOCTYPE html>
<html>
<head>
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>New Password</h1>
        <p>Enter your new password below.</p>
        <input type="password" id="new-password" placeholder="Minimum 6 characters" style="width: 100%; margin-top: 15px;">
        <button onclick="submitNewPassword()" style="background: var(--primary); color: white; width: 100%; margin-top: 15px; padding: 12px; border:none; border-radius:8px;">Update Password</button>
        <p id="reset-msg" style="margin-top: 10px; color: green;"></p>
    </div>

    <script>
        async function submitNewPassword() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const newPassword = document.getElementById('new-password').value;

            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });

            const data = await res.json();
            alert(data.message);
            if (res.ok) window.location.href = '/';
        }
    </script>
</body>
</html>
